
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Study Assistant - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">🤖</div>

            <h1>AI Learning</h1>
            <h2>Study Assistant</h2>

            <p class="subtitle">
                Your AI-powered college study companion
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login to Study Assistant
                </button>

            </form>

            <p id="message"></p>

            <div class="features">
                <span>📚 RAG</span>
                <span>🧠 Memory</span>
                <span>🛠️ Tools</span>
                <span>🦙 Ollama</span>
            </div>

            <p class="footer">
                AI Learning Study Assistant
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
